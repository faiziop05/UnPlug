        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

          const r = data[i];
          const g = data[i + 1];

            Math.abs(g - 118) < 80 &&

            data[i + 1] = 255;

            data[i + 1] = 118;
            data[i + 2] = 110;

        ctx.putImageData(imageData, 0, 0);
        document.body.setAttribute("data-ready", "true");
